name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  PLUGIN_DLL: Jellyfin.Plugin.SatIpFreesat.dll
  PLUGIN_PROJECT: Jellyfin.Plugin.SatIpFreesat/Jellyfin.Plugin.SatIpFreesat.csproj

jobs:
  release:
    name: Build, Package, and Release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      # ── Jellyfin 10.x build (net9.0, assembly 1.0.0.0) ─────────────────
      - name: Build net9.0
        run: dotnet publish "$PLUGIN_PROJECT" -f net9.0 -c Release -o publish/net9 --no-restore

      - name: Package net9.0
        run: |
          mkdir -p artifacts
          cp publish/net9/$PLUGIN_DLL artifacts/
          cd artifacts
          zip -j jellyfin-plugin-satip-freesat-v1.0.0.0-jellyfin10.zip $PLUGIN_DLL
          rm $PLUGIN_DLL

      # ── Jellyfin 12.x build (net10.0, assembly 2.0.0.0) ─────────────────
      - name: Build net10.0
        run: dotnet publish "$PLUGIN_PROJECT" -f net10.0 -c Release -o publish/net10 --no-restore

      - name: Package net10.0
        run: |
          cp publish/net10/$PLUGIN_DLL artifacts/
          cd artifacts
          zip -j jellyfin-plugin-satip-freesat-v2.0.0.0-jellyfin12.zip $PLUGIN_DLL
          rm $PLUGIN_DLL

      # ── Checksums ─────────────────────────────────────────────────────────
      - name: Compute checksums
        id: checksums
        run: |
          MD5_10=$(md5sum artifacts/jellyfin-plugin-satip-freesat-v1.0.0.0-jellyfin10.zip | awk '{print $1}')
          MD5_12=$(md5sum artifacts/jellyfin-plugin-satip-freesat-v2.0.0.0-jellyfin12.zip | awk '{print $1}')
          echo "md5_10=$MD5_10" >> "$GITHUB_OUTPUT"
          echo "md5_12=$MD5_12" >> "$GITHUB_OUTPUT"
          echo "Jellyfin 10.x checksum: $MD5_10"
          echo "Jellyfin 12.x checksum: $MD5_12"

      # ── Update docs/manifest.json ─────────────────────────────────────────
      - name: Update manifest checksums
        env:
          TAG: ${{ github.ref_name }}
          MD5_10: ${{ steps.checksums.outputs.md5_10 }}
          MD5_12: ${{ steps.checksums.outputs.md5_12 }}
        run: |
          jq --arg md5_10 "$MD5_10" \
             --arg md5_12 "$MD5_12" \
             --arg ts "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
             --arg tag "$TAG" \
             --arg url_10 "https://github.com/neilmanfredit/jellyfin-plugin-satip-freesat/releases/download/${TAG}/jellyfin-plugin-satip-freesat-v1.0.0.0-jellyfin10.zip" \
             --arg url_12 "https://github.com/neilmanfredit/jellyfin-plugin-satip-freesat/releases/download/${TAG}/jellyfin-plugin-satip-freesat-v2.0.0.0-jellyfin12.zip" \
          '.[0].versions |= map(
            if .version == "1.0.0.0" then
              .checksum = $md5_10 | .sourceUrl = $url_10 | .timestamp = $ts
            elif .version == "2.0.0.0" then
              .checksum = $md5_12 | .sourceUrl = $url_12 | .timestamp = $ts
            else . end
          )' docs/manifest.json > docs/manifest.json.tmp
          mv docs/manifest.json.tmp docs/manifest.json

      - name: Commit and push manifest
        env:
          TAG: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/manifest.json
          git diff --staged --quiet || git commit -m "chore: update manifest checksums for ${TAG}"
          git push origin HEAD:main

      # ── GitHub Release ────────────────────────────────────────────────────
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            artifacts/jellyfin-plugin-satip-freesat-v1.0.0.0-jellyfin10.zip
            artifacts/jellyfin-plugin-satip-freesat-v2.0.0.0-jellyfin12.zip
          body: |
            ## Jellyfin compatibility

            | Zip file | Jellyfin version | .NET |
            |----------|-----------------|------|
            | `jellyfin-plugin-satip-freesat-v1.0.0.0-jellyfin10.zip` | 10.11.x | net9.0 |
            | `jellyfin-plugin-satip-freesat-v2.0.0.0-jellyfin12.zip` | 12.x | net10.0 |

            Install via the plugin repository: add `https://neilmanfredit.github.io/jellyfin-plugin-satip-freesat/manifest.json` to **Dashboard → Plugins → Repositories**.
